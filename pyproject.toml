[project]
name = "maida-assert-smoke"
version = "0.1.0"
description = "A synthetic sales agent for testing the Maida GitHub Action"
requires-python = ">=3.12,<3.14"
dependencies = ["maida-ai==0.5.3"]

[dependency-groups]
dev = ["pytest>=9,<10", "pytest-cov>=7,<8", "ruff>=0.16,<0.17"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
source = ["sales_agent"]

[tool.coverage.report]
show_missing = true
fail_under = 95
